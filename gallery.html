<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17181c">
<title>iNat gallery</title>

<!-- The manifest is the map's, and its theme_color with it: what gets installed is the app,
     and the app is the map. The darker room is this page's own, and the meta above still
     wins while it is open — the manifest colour only ever paints the splash and the
     launcher, which belong to the thing that was installed. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="gallery.css">
</head>
<body>

<header>
  <div class="masthead">
    <div class="who" id="who">&nbsp;</div>
    <div class="stat">
      <div class="tally" id="tally"></div>
      <span class="picker" id="picker" hidden>
        <select id="view" aria-label="Which photographs to show">
          <option value="highlights">Highlights</option>
          <option value="birds">Birds - most recent observations</option>
          <option value="all">All - most recent observations</option>
        </select>
      </span>
    </div>
  </div>
  <div class="taxonSearch" id="taxonSearch" hidden>
    <input type="search" id="taxonInput" autocomplete="off" spellcheck="false"
           placeholder="Search species or group&hellip;" aria-label="Search for a species or group">
    <div class="ac" id="taxonAc" hidden></div>
    <div class="picked" id="taxonSel" hidden>
      <span id="taxonSelName"></span>
      <button type="button" id="taxonParent" disabled
              title="Set the taxon to its parent" aria-label="Set the taxon to its parent">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 13V3M8 3L4 7M8 3l4 4"
                fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button type="button" id="taxonClear" aria-label="Clear species">&times;</button>
    </div>
  </div>
  <div class="taxa" id="taxaFilter" hidden></div>
  <div class="narrow" id="narrow" hidden>
    <span class="lede">When</span>
    <input type="date" id="dateFrom" aria-label="From date">
    <span class="to">&ndash;</span>
    <input type="date" id="dateTo" aria-label="To date">
    <span class="lede where">Where</span>
    <span class="placeWrap" id="placeWrap">
      <input type="text" id="placeInput" placeholder="place" aria-label="Filter by place" autocomplete="off" autocapitalize="none" spellcheck="false">
      <div class="ac" id="placeAc" hidden></div>
    </span>
  </div>
  <div class="filters" id="filters" hidden>
    <span class="lede">Show</span>
    <button type="button" data-show="unseen">Unseen</button>
    <button type="button" data-show="all">All</button>
    <label class="obstoggle">
      <input type="checkbox" id="byObs">
      <span class="ck" aria-hidden="true">
        <svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.9 9.1 9.8 3.4"></path></svg>
      </span>
      <span class="cklab">By observation</span>
    </label>
    <button type="button" id="forget" hidden>Forget seen</button>
  </div>
</header>

<main>
  <div id="grid"></div>
  <div class="loading" id="loading" hidden>Loading</div>
  <div class="status" id="status" hidden></div>
</main>

<!-- Where the scroll is in the years. Drawn from the dates already on the page, so it says
     nothing the wall doesn't; hidden from screen readers for the same reason. -->
<div class="rail" id="rail" hidden aria-hidden="true">
  <div class="track" id="track"><div class="now" id="now"></div></div>
</div>

<div id="focus" aria-hidden="true">
  <div class="stage">
    <img id="lo" alt="">
    <img id="hi" alt="">
  </div>
  <button class="zone" id="prevZone" aria-label="Previous photo"></button>
  <button class="zone" id="nextZone" aria-label="Next photo"></button>
  <div class="bar">
    <span class="counter" id="counter"></span>
    <button id="close" aria-label="Close">&times;</button>
  </div>
  <div class="label">
    <div class="binomial" id="binomial"><span id="binomialName"></span><span class="rg" id="rgBadge" hidden>RG</span><span class="idcount" id="idCount"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3z"></path></svg><span id="idCountNum">0</span></span></div>
    <div class="meta" id="metaline"></div>
  </div>
</div>

<script src="gallery.js"></script>

<!-- The offline shell (sw.js) — the same block as the map's, where the reasoning is written
     down: updateViaCache:"none" keeps the look at sw.js fresh, and controllerchange reloads
     the page once when a new worker takes over. This page caches the shell and not one
     photograph: the wall is the data. -->
<script>
if(location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  const held = !!navigator.serviceWorker.controller;
  let taken = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!held || taken) return;
    taken = true;
    location.reload();
  });
  addEventListener("load", () => {
    try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}); } catch(err){}
  });
}
</script>
</body>
</html>
