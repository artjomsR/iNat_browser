<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field">
<meta name="theme-color" content="#0D1714">
<title>Field — iNaturalist observations</title>

<!-- The map is what "the app" means: the manifest's start_url comes back here from whichever
     page it was installed from, and its colours are this page's. -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="index.css">
</head>
<body>

<div id="map"></div>

<!-- Only ever on screen with no connection, and then it is the first thing on it. The app
     opens off the cache now, which means it can open into a silence it used to fail loudly
     in; this is the page saying which. -->
<div class="offline" id="offline" role="status" hidden>
  <b>Offline</b><span>The app is cached &mdash; the observations aren&rsquo;t. Pins, tiles and searches come back with the signal.</span>
</div>

<button class="label-bar" id="labelBar" aria-label="Change filters">
  <span class="lozenge" aria-hidden="true"></span>
  <span class="label-text" id="labelText">All observations</span>
  <span class="label-chevron" aria-hidden="true">EDIT</span>
</button>

<!-- Purely a status light: the map and label already say what changed once a fetch or tile
     load lands, so this has nothing of its own worth announcing to a screen reader. -->
<div class="loading" id="loading" hidden aria-hidden="true">
  <svg viewBox="0 0 24 24" fill="none">
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="15 45"/>
  </svg>
</div>

<div class="zoom" id="zoom" role="group" aria-label="Zoom">
  <button type="button" id="zoomIn" aria-label="Zoom in">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M12 5v14M5 12h14"/>
    </svg>
  </button>
  <button type="button" id="zoomOut" aria-label="Zoom out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M5 12h14"/>
    </svg>
  </button>
</div>

<button class="locate" id="locate" aria-label="Go to my location">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="7.6" opacity=".45"/>
    <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/>
  </svg>
</button>

<button class="stow" id="stow" aria-controls="sheet" aria-expanded="true" aria-label="Collapse the list">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6.5 6.5 12 12 17.5"/><path d="M17.5 6.5 12 12 17.5 17.5"/>
  </svg>
</button>

<div class="acc-legend" id="accLegend" hidden>
  <div class="acc-legend-title">Location accuracy</div>
  <div class="acc-legend-bar" id="accBar"></div>
  <div class="acc-legend-ticks"><span>&le;1m</span><span>10m</span><span>150m</span><span>1km+</span></div>
  <div class="acc-legend-unknown"><span class="acc-dot acc-dot-unknown"></span>= ?m</div>
  <div class="acc-legend-status" id="accStatus"></div>
  <div class="acc-legend-radius">
    <div class="acc-legend-title">Tap radius</div>
    <div class="seg" id="cursorRow">
      <button type="button" data-v="precise" aria-pressed="true">Precise</button>
      <button type="button" data-v="large" aria-pressed="false">Large</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" data-open="0" role="dialog" aria-label="Panel">
  <button class="handle" id="handle" aria-label="Close panel"><span></span></button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<!-- common.js first: it declares what index.js expects to already be there. -->
<script src="common.js"></script>
<script src="index.js"></script>

<!-- The offline shell (sw.js). Inline rather than a file, on purpose and in all three
     pages: a third <script src> would break the two-script ceiling CLAUDE.md sets, and a
     block inside index.js or species.js would install a worker every time test.html loaded
     those scripts to assert against them — a worker that would then serve the very file
     being edited out of a cache. Registered on load so it doesn't compete with the map's
     first burst of requests.

     The protocol is checked rather than the attempt simply being allowed to fail: a worker
     needs an origin and file:// has none, and asking anyway costs a red line in the console
     on every disk-opened page, which the catch cannot swallow because the browser logs it
     itself. CLAUDE.md calls file:// a supported way to run this, and supported means silent.
     Everything else — a private window, a policy, a browser with no worker at all — is still
     caught rather than checked for, since those are refusals and not addresses. No worker,
     and this is the app it always was.

     updateViaCache:"none" asks the browser to look for a new sw.js on the network rather
     than in its HTTP cache, which is what makes a bump to VERSION inside sw.js noticed. The
     controllerchange listener then reloads the page once a new worker has taken over, so a
     shell update lands on the same launch instead of the next one. It only fires where this
     page already had a worker in charge (held) — the first visit, when the worker merely
     claims the page, must not double-load it — and a reload is safe to take unasked because
     the page's state is its address: the hash rides a reload untouched. -->
<script>
if(location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  const held = !!navigator.serviceWorker.controller;
  let taken = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if(!held || taken) return;
    taken = true;
    location.reload();
  });
  addEventListener("load", () => {
    try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}); } catch(err){}
  });
}
</script>
</body>
</html>
