<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field">
<meta name="theme-color" content="#0D1714">
<title>Field — iNaturalist observations</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0D1714;
  --panel:#14211D;
  --raise:#1B2C26;
  --rule:#26382F;
  --text:#E8F0EB;
  --mute:#7C9389;
  --mark:#FF3E7C;
  --verified:#6FD3A8;

  --ui:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
  --lit:"Newsreader",Georgia,"Times New Roman",serif;

  --peek:0px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  position:fixed;inset:0;overflow:hidden;
  background:var(--ink);color:var(--text);
  font-family:var(--ui);
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}

/* ---------- map ---------- */
#map{position:absolute;inset:0;background:var(--ink)}
.leaflet-container{background:var(--ink);font-family:var(--ui)}
.leaflet-control-attribution{
  background:rgba(13,23,20,.82);color:var(--mute);
  font-family:var(--ui);font-size:9px;letter-spacing:.02em;
  padding:2px 6px;border-radius:3px 0 0 0;
}
.leaflet-control-attribution a{color:var(--mute)}
.leaflet-control-zoom{display:none}
.leaflet-bottom.leaflet-right{margin-bottom:var(--safe-b)}
.leaflet-tooltip{
  background:rgba(20,33,29,.95);color:var(--text);
  border:1px solid var(--rule);border-radius:6px;
  font-family:var(--ui);font-size:11px;padding:4px 8px;box-shadow:none;
}
.leaflet-tooltip-top:before{border-top-color:rgba(20,33,29,.95)}

/* ---------- accuracy legend ---------- */
.acc-legend{
  position:absolute;z-index:600;left:12px;
  bottom:calc(var(--safe-b) + 22px);
  width:168px;padding:10px 11px 11px;
  background:rgba(20,33,29,.92);border:1px solid var(--rule);border-radius:10px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.acc-legend[hidden]{display:none}
.acc-legend-title{
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mute);margin-bottom:7px;
}
.acc-legend-bar{height:8px;border-radius:4px;margin-bottom:4px}
.acc-legend-ticks{
  display:flex;justify-content:space-between;
  font-size:8.5px;color:var(--mute);letter-spacing:.02em;margin-bottom:9px;
}
.acc-legend-unknown{
  display:flex;align-items:center;gap:6px;
  font-size:9.5px;color:var(--mute);margin-bottom:7px;
}
.acc-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.acc-dot-unknown{background:#fff;border:1.5px solid #101613}
.acc-legend-status{
  font-size:9.5px;color:var(--mute);line-height:1.4;
  padding-top:7px;border-top:1px solid var(--rule);
}
.acc-legend-radius{padding-top:8px;margin-top:8px;border-top:1px solid var(--rule)}
.acc-legend-radius .seg button{padding:6px 4px;font-size:9px;letter-spacing:.08em}

/* ---------- specimen label bar (signature) ---------- */
.label-bar{
  position:absolute;z-index:600;
  top:calc(var(--safe-t) + 8px);right:12px;left:auto;
  max-width:calc(100% - 24px);
  padding:8px 12px;border-radius:10px;
  background:rgba(20,33,29,.92);border:1px solid var(--rule);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  width:auto;text-align:left;
  font:inherit;color:inherit;cursor:pointer;
  display:flex;align-items:center;gap:9px;
}
.label-bar:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.lozenge{flex:0 0 auto;width:11px;height:11px;transform:rotate(45deg);border:1.5px solid var(--mark)}
.label-text{
  flex:1 1 auto;min-width:0;
  font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.label-text .sci{
  font-family:var(--lit);font-style:italic;font-weight:400;
  font-size:14px;letter-spacing:.01em;text-transform:none;color:var(--text);
}
.label-text .sep{color:var(--rule);margin:0 6px}
.label-text .dim{color:var(--mute)}
.label-chevron{flex:0 0 auto;color:var(--mute);font-size:10px;letter-spacing:.1em}

/* ---------- locate ---------- */
.locate{
  position:absolute;z-index:600;right:12px;
  bottom:calc(var(--safe-b) + 22px);
  width:46px;height:46px;border-radius:50%;
  background:rgba(20,33,29,.92);border:1px solid var(--rule);
  color:var(--text);display:grid;place-items:center;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:transform .16s ease,border-color .16s ease;
}
.locate:active{transform:scale(.93)}
.locate[data-busy="1"]{border-color:var(--mark)}
.locate svg{width:19px;height:19px}
.locate:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

/* ---------- sheet ---------- */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:700;
  max-height:82vh;display:flex;flex-direction:column;
  background:var(--panel);
  border-top:1px solid var(--rule);
  border-radius:14px 14px 0 0;
  transform:translateY(101%);
  transition:transform .26s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -18px 44px rgba(0,0,0,.5);
}
.sheet[data-open="1"]{transform:translateY(0)}
.handle{
  flex:0 0 auto;padding:9px 0 5px;border:0;background:none;width:100%;cursor:pointer;
}
.handle span{display:block;width:34px;height:3px;border-radius:2px;background:var(--rule);margin:0 auto}
.handle:focus-visible{outline:2px solid var(--mark);outline-offset:-4px}
.sheet-body{
  flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:2px 14px calc(var(--safe-b) + 16px);
}

.eyebrow{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--mute);padding:8px 0 10px;
}
.linkish{
  background:none;border:0;padding:2px 0;cursor:pointer;
  font:inherit;color:var(--mark);letter-spacing:.14em;
}
.linkish:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.eyebrow-actions{display:flex;align-items:baseline;gap:14px;flex:0 0 auto}

.field{margin-bottom:15px}
.field > label,.field-label{
  display:block;font-size:9.5px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--mute);margin-bottom:6px;
}
.input{
  width:100%;padding:11px 12px;font:inherit;font-size:15px;
  color:var(--text);background:var(--raise);
  border:1px solid var(--rule);border-radius:7px;
  -webkit-appearance:none;appearance:none;
}
.input::placeholder{color:var(--mute)}
.input:focus{outline:none;border-color:var(--mark)}
.field-hint{
  margin:6px 2px 0;font-size:11px;line-height:1.45;color:var(--mute);
  font-family:var(--lit);
}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* segmented */
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{
  flex:1 1 auto;padding:9px 6px;cursor:pointer;
  font:inherit;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);background:var(--raise);
  border:1px solid var(--rule);border-radius:6px;
  transition:color .14s,border-color .14s;
}
.seg button[aria-pressed="true"]{color:var(--ink);background:var(--mark);border-color:var(--mark)}
.seg button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.input + .seg{margin-top:8px}
.seg + .seg{margin-top:6px}
.field-hint + .seg{margin-top:9px}
/* a lone action inside a seg row — reads as a button to press, not a toggle to hold */
.seg.act button{color:var(--text);border-color:var(--mute)}
.seg.act button:hover{color:var(--mark);border-color:var(--mark)}
.seg.act button[data-busy="1"]{color:var(--mute);border-color:var(--mark)}
.seg.act button[disabled]{opacity:.35;cursor:default}
.seg.act button[disabled]:hover{color:var(--text);border-color:var(--mute)}

/* tickbox — `label.check` matches the specificity of the `.field > label` rule above,
   which would otherwise blockify the row and drop the caption below the box. */
label.check{
  display:flex;align-items:center;gap:9px;margin:8px 0 5px;cursor:pointer;
  font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mute);transition:color .14s;
}
.check input{
  flex:0 0 auto;width:16px;height:16px;margin:0;cursor:pointer;
  display:grid;place-content:center;
  background:var(--raise);border:1px solid var(--rule);border-radius:5px;
  -webkit-appearance:none;appearance:none;transition:background .14s,border-color .14s;
}
.check input::after{
  content:"";width:4px;height:8px;margin-top:-2px;
  border:solid var(--ink);border-width:0 2px 2px 0;
  transform:rotate(45deg) scale(0);transition:transform .14s;
}
.check input:checked{background:var(--mark);border-color:var(--mark)}
.check input:checked::after{transform:rotate(45deg) scale(1)}
.check input:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.check:has(input:checked){color:var(--text)}

/* iconic chips */
.chips{
  display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.chips::-webkit-scrollbar{display:none}
/* Mouse pointers can't swipe, so give them a real scrollbar to drag. */
@media (hover:hover) and (pointer:fine){
  .chips{scrollbar-width:thin;scrollbar-color:var(--rule) transparent;padding-bottom:6px}
  .chips::-webkit-scrollbar{display:block;height:7px}
  .chips::-webkit-scrollbar-track{background:transparent}
  .chips::-webkit-scrollbar-thumb{background:var(--rule);border-radius:4px}
  .chips::-webkit-scrollbar-thumb:hover{background:var(--mute)}
}
.chips button{
  flex:0 0 auto;padding:8px 13px;cursor:pointer;white-space:nowrap;
  font:inherit;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mute);background:var(--raise);
  border:1px solid var(--rule);border-radius:20px;
}
.chips button[aria-pressed="true"]{color:var(--ink);background:var(--mark);border-color:var(--mark)}
.chips button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

/* taxon autocomplete */
.ac-wrap{position:relative}
.ac{
  position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:20;
  background:var(--raise);border:1px solid var(--rule);border-radius:8px;
  overflow:hidden;max-height:264px;overflow-y:auto;
}
.ac[hidden]{display:none}
.ac button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 11px;border:0;border-bottom:1px solid var(--rule);
  background:none;color:var(--text);font:inherit;cursor:pointer;
}
.ac button:last-child{border-bottom:0}
.ac button:hover,.ac button:focus-visible{background:var(--panel);outline:none}
.ac img{width:32px;height:32px;border-radius:4px;object-fit:cover;flex:0 0 auto;background:var(--panel)}
.ac .ac-nophoto{width:32px;height:32px;border-radius:4px;flex:0 0 auto;background:var(--panel);border:1px solid var(--rule)}
.ac-name{flex:1 1 auto;min-width:0}
.ac-common{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-sci{
  font-family:var(--lit);font-style:italic;font-size:12.5px;color:var(--mute);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ac-rank{
  flex:0 0 auto;font-size:9px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);
}

.selected{
  display:flex;align-items:center;gap:9px;margin-top:7px;padding:9px 11px;
  background:var(--raise);border:1px solid var(--mark);border-radius:7px;
}
.selected[hidden]{display:none}
.selected .s-sci{flex:1 1 auto;font-family:var(--lit);font-style:italic;font-size:15px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.selected button{
  flex:0 0 auto;width:24px;height:24px;border-radius:50%;cursor:pointer;
  background:none;border:1px solid var(--rule);color:var(--mute);
  font:inherit;font-size:13px;line-height:1;display:grid;place-items:center;
}
.selected button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}

.divider{height:1px;background:var(--rule);margin:20px 0 16px}

.done{
  width:100%;padding:13px;margin-top:4px;cursor:pointer;
  font:inherit;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink);background:var(--mark);border:0;border-radius:8px;
}
.done:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* ---------- results ---------- */
.result{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:11px 0;border:0;border-bottom:1px solid var(--rule);
  background:none;color:var(--text);font:inherit;cursor:pointer;
}
.result:last-child{border-bottom:0}
.result:focus-visible{outline:2px solid var(--mark);outline-offset:-2px}
.result-photo{
  width:54px;height:54px;flex:0 0 auto;border-radius:5px;object-fit:cover;
  background:var(--raise);border:1px solid var(--rule);
}
.result-nophoto{
  width:54px;height:54px;flex:0 0 auto;border-radius:5px;
  background:var(--raise);border:1px solid var(--rule);
  display:grid;place-items:center;color:var(--rule);font-size:17px;
}
.result-nophoto svg{width:26px;height:26px}
.result-audio{color:var(--mute)}          /* sound-only: readable, not a dim placeholder */

/* audio-only map pin */
.snd-pin{background:none;border:0}
.snd-pin svg{width:19px;height:19px;display:block;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.6))}
.result-main{flex:1 1 auto;min-width:0;padding-top:1px}
.result-common{
  font-size:15px;line-height:1.25;margin-bottom:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.result-sci{
  font-family:var(--lit);font-style:italic;font-size:13px;color:var(--mute);
  line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.result-meta{
  margin-top:5px;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;
  color:var(--mute);display:flex;flex-wrap:wrap;align-items:center;gap:7px;
}
.badge{
  padding:2px 5px;border-radius:3px;border:1px solid currentColor;
  font-size:8.5px;letter-spacing:.1em;
}
.badge-rg{color:var(--verified)}
.badge-ob{color:var(--mark)}

.state{padding:26px 4px 30px;text-align:center;color:var(--mute)}
.state-lede{font-family:var(--lit);font-size:17px;color:var(--text);margin-bottom:7px}
.state-hint{font-size:11.5px;letter-spacing:.06em;line-height:1.6}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
@media (min-width:720px){
  .sheet{left:auto;right:14px;bottom:14px;width:380px;border-radius:14px;max-height:calc(100vh - 100px)}
  .sheet{transform:translateY(calc(100% + 20px))}
  .sheet[data-open="1"]{transform:translateY(0)}
  .label-bar{max-width:640px}
  .locate{right:410px}
}
</style>
</head>
<body>

<div id="map"></div>

<button class="label-bar" id="labelBar" aria-label="Change filters">
  <span class="lozenge" aria-hidden="true"></span>
  <span class="label-text" id="labelText">All observations</span>
  <span class="label-chevron" aria-hidden="true">EDIT</span>
</button>

<button class="locate" id="locate" aria-label="Go to my location">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="7.6" opacity=".45"/>
    <path d="M12 1.6v3M12 19.4v3M1.6 12h3M19.4 12h3"/>
  </svg>
</button>

<div class="acc-legend" id="accLegend" hidden>
  <div class="acc-legend-title">Location accuracy</div>
  <div class="acc-legend-bar" id="accBar"></div>
  <div class="acc-legend-ticks"><span>&le;1m</span><span>10m</span><span>150m</span><span>1km+</span></div>
  <div class="acc-legend-unknown"><span class="acc-dot acc-dot-unknown"></span>No accuracy recorded</div>
  <div class="acc-legend-status" id="accStatus"></div>
  <div class="acc-legend-radius">
    <div class="acc-legend-title">Tap radius</div>
    <div class="seg" id="cursorRow">
      <button type="button" data-v="precise" aria-pressed="true">Precise</button>
      <button type="button" data-v="large" aria-pressed="false">Large</button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" data-open="0" role="dialog" aria-label="Panel">
  <button class="handle" id="handle" aria-label="Close panel"><span></span></button>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

const API  = "https://api.inaturalist.org/v1";
const MARK = "#FF3E7C";

const ICONIC = [
  ["Plantae","Plants"],["Aves","Birds"],["Insecta","Insects"],["Fungi","Fungi"],
  ["Arachnida","Arachnids"],["Mammalia","Mammals"],["Reptilia","Reptiles"],
  ["Amphibia","Amphibians"],["Actinopterygii","Fish"],["Mollusca","Molluscs"]
];
const QUALITY = [["research","Research"],["needs_id","Needs ID"],["casual","Casual"]];
const PRECISION = [["","Any"],["precise","Exact only"]];
const STYLES  = [["auto","Auto"],["points","Points"],["grid","Grid"],["heat","Heat"],["accuracy","Accuracy"]];
const BASES   = [["dark","Dark"],["light","Light"],["sat","Satellite"]];

function defaultD1(){
  const d = new Date();
  d.setMonth(d.getMonth() - 3);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function defaultQuality(){ return ["research","needs_id"]; }
function isDefaultQuality(){
  const d = defaultQuality();
  return state.quality.length === d.length && d.every(v => state.quality.includes(v));
}

const state = {
  taxon:null, tname:"", iconic:[], quality:defaultQuality(),
  d1:defaultD1(), d2:"", style:"accuracy", base:"dark", unobs:"", precise:"precise",
  dmode:"unobserved", lvlExclude:null, cursor:"precise", ssp:""   // "" | "1" incl. | "only"
};

let map, overlay, accLayer, probeAccLayer, probeMark, probeRing, meRing, sheetView = null;

/* ---------------- query building ---------------- */

function obsParams(){
  const p = new URLSearchParams();
  if(state.taxon)   p.set("taxon_id", state.taxon);
  if(state.iconic.length) p.set("iconic_taxa", state.iconic.join(","));
  if(state.unobs){
    if(state.dmode === "unobserved"){
      p.set("unobserved_by_user_id", state.unobs);
    }else if(state.lvlExclude && state.lvlExclude.length){
      // Level mode: hide species this user has already tagged at this level.
      p.set("without_taxon_id", state.lvlExclude.join(","));
    }
    // Rank window on the results, driven by the two tickboxes. Unticked, the list is
    // floored at species: iNat treats a subspecies as its own leaf taxon, so without this
    // a ssp. of an already-recorded species still reads as "desired" (genus-and-coarser
    // IDs stay; only subspecies/variety/form go). "Include subspecies" drops the floor;
    // "Only subspecies" swaps it for a ceiling, leaving nothing but infraspecific taxa.
    if(state.ssp === "only") p.set("hrank", "subspecies");
    else if(!state.ssp)      p.set("lrank", "species");
    // Never show them their own shots. Redundant under Unobserved — a species they have
    // recorded is already gone whole — but in a level mode their untagged species are on
    // the map, and those pins lead back to ground they have already walked.
    p.set("not_user_id", state.unobs);
  }
  if(state.quality.length) p.set("quality_grade", state.quality.join(","));
  if(state.precise){ p.set("geoprivacy", "open"); p.set("taxon_geoprivacy", "open"); }
  if(state.d1)      p.set("d1", state.d1);
  if(state.d2)      p.set("d2", state.d2);
  return p;
}

// Desired-species levels, best first — each value is both the button's mode and the
// observation tag it matches. The priority stacks: picking a level hides species already
// tagged at that level *or better*, so the exclusion set for level i is tags 0..i.
// Note the top tier is "s", not "a": iNat's search index treats "a" as an English
// stopword and silently drops it (search_on=tags&q=a matches nothing, site-wide).
const LEVELS = ["s","b","c"];

// Scope a species_counts query to one user plus the panel's taxon / quick-group filters.
function userScope(user){
  const o = { user_id: user };
  if(state.taxon) o.taxon_id = state.taxon;
  if(state.iconic.length) o.iconic_taxa = state.iconic.join(",");
  return o;
}

// Page through species_counts and return the raw {taxon, count} rows. `stale`, when
// given, is polled between pages so a superseded caller can bail out early.
async function speciesCounts(params, stale){
  const out = [];
  for(let page = 1; page <= 20; page++){
    const p = new URLSearchParams(params);
    p.set("per_page", "500");
    p.set("page", String(page));
    const r = await fetch(`${API}/observations/species_counts?${p.toString()}`);
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(stale && stale()) return out;
    (d.results || []).forEach(x => { if(x.taxon && x.taxon.id) out.push(x); });
    if(page * 500 >= (d.total_results || 0)) break;
  }
  return out;
}

// The species carrying one tier's tag. One request per tag: the tags index matches a
// single term, so "s b" ORs nothing.
async function speciesIdsWithTag(user, tag, stale){
  const rows = await speciesCounts({ ...userScope(user), search_on:"tags", q:tag }, stale);
  return new Set(rows.map(x => x.taxon.id));
}

// The species a user has tagged at `level` or better. The tiers stack, so level i means
// tags 0..i.
async function taggedSpeciesIds(user, level, stale){
  const ids = new Set();                     // a species may be tagged at several tiers
  for(const tag of LEVELS.slice(0, LEVELS.indexOf(level) + 1)){
    const tier = await speciesIdsWithTag(user, tag, stale);
    if(stale && stale()) return ids;
    tier.forEach(id => ids.add(id));
  }
  return ids;
}

// Cache the ids of species the "Desired species for" user has already tagged at the
// selected level or better, so obsParams can drop them via without_taxon_id. Clears the
// cache (no-op) for Unobserved mode or when no user is set.
let lvlSeq = 0;
async function syncLvlExclude(){
  if(state.dmode === "unobserved" || !state.unobs){ state.lvlExclude = null; return; }
  if(LEVELS.indexOf(state.dmode) < 0){ state.lvlExclude = null; return; }
  const mine = ++lvlSeq;
  const stale = () => mine !== lvlSeq;       // a newer sync superseded this one
  try{
    const ids = await taggedSpeciesIds(state.unobs, state.dmode, stale);
    if(stale()) return;
    state.lvlExclude = [...ids];
  }catch(e){
    if(stale()) return;
    state.lvlExclude = [];                   // fail open: exclude nothing on error
  }
}

function activeStyle(){
  if(state.style === "heat")   return "colored_heatmap";
  if(state.style === "points") return "points";
  if(state.style === "grid")   return "grid";
  return map.getZoom() < 10 ? "grid" : "points";
}

function tileUrl(){
  const style = activeStyle();
  const p = obsParams();
  if(style === "points" || style === "grid") p.set("color", MARK);
  const qs = p.toString();
  return `${API}/${style}/{z}/{x}/{y}.png` + (qs ? "?" + qs : "");
}

function refreshOverlay(){
  const url = tileUrl();
  if(overlay._url !== url) overlay.setUrl(url);
}

/* ---------------- audio-only observations ---------------- */

// A sound recording with no photo. Both the map pins and the tap results swap their
// usual dot for a speaker so these read as listen-not-look records at a glance.
function isAudioOnly(o){
  return (o.sounds || []).length > 0 && !(o.photos || []).length;
}

// fill paints the cone, ring the outline and waves — pass the same colour for a flat
// monochrome icon (the results list), or contrasting ones for a map pin.
function speakerSvg(fill, ring){
  return `<svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3.5 9.5H6.7L11.5 6V18L6.7 14.5H3.5Z"
          fill="${fill}" stroke="${ring}" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M14.6 9.6a4.2 4.2 0 010 4.8M17.6 7.6a8 8 0 010 8.8"
          fill="none" stroke="${ring}" stroke-width="1.7" stroke-linecap="round"/>
  </svg>`;
}

/* ---------------- accuracy color scale ---------------- */

const ACC_STOPS = [        // [meters, hex] — log-scale interpolated between stops
  [0,    "#FF2D2D"],
  [1,    "#FF2D2D"],
  [10,   "#FF8C00"],
  [50,   "#FFD400"],
  [150,  "#7ED321"],
  [400,  "#2D9CFF"],
  [1000, "#6A2DFF"]
];
const ACC_MAX_COLOR    = "#160026";  // beyond 1km, deepening toward black/purple
const ACC_UNKNOWN_FILL = "#FFFFFF";
const ACC_UNKNOWN_RING = "#101613";

function hexToRgb(hex){
  const n = hex.replace("#","");
  return [parseInt(n.slice(0,2),16), parseInt(n.slice(2,4),16), parseInt(n.slice(4,6),16)];
}
function rgbToHex(r,g,b){
  return "#" + [r,g,b].map(v => Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,"0")).join("");
}
function lerpColor(a,b,t){
  const [r1,g1,b1] = hexToRgb(a), [r2,g2,b2] = hexToRgb(b);
  return rgbToHex(r1+(r2-r1)*t, g1+(g2-g1)*t, b1+(b2-b1)*t);
}

function accuracyColor(m){
  const last = ACC_STOPS[ACC_STOPS.length - 1];
  if(m >= last[0]){
    const t = Math.min(1, Math.log(m / last[0]) / Math.log(5));
    return lerpColor(last[1], ACC_MAX_COLOR, t);
  }
  for(let i=0;i<ACC_STOPS.length-1;i++){
    const [m0,c0] = ACC_STOPS[i], [m1,c1] = ACC_STOPS[i+1];
    if(m <= m1){
      const lo = Math.max(m0, 0.1), hi = Math.max(m1, 0.2);
      const mm = Math.max(m, lo);
      const t = Math.min(1, Math.max(0, (Math.log(mm) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))));
      return lerpColor(c0, c1, t);
    }
  }
  return last[1];
}

function legendGradientCss(){
  const stops = ACC_STOPS.map(s => s[1]).concat([ACC_MAX_COLOR]);
  const n = stops.length - 1;
  return "linear-gradient(to right, " + stops.map((c,i) => `${c} ${(i/n*100).toFixed(1)}%`).join(", ") + ")";
}

function fmtAcc(m){
  if(m == null || !isFinite(m)) return "No accuracy data";
  if(m < 1000) return Math.round(m) + " m";
  return (m/1000).toFixed(1) + " km";
}

/* ---------------- basemaps ---------------- */

const OSM_ATTR = '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
const INAT_ATTR = 'Observations &copy; <a href="https://www.inaturalist.org">iNaturalist</a>';

function makeBase(kind){
  if(kind === "sat"){
    return L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom:19, attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics &middot; ' + INAT_ATTR });
  }
  const slug = kind === "light" ? "light_all" : "dark_all";
  return L.tileLayer(`https://{s}.basemaps.cartocdn.com/${slug}/{z}/{x}/{y}{r}.png`,
    { maxZoom:20, subdomains:"abcd", attribution: OSM_ATTR + " &middot; " + INAT_ATTR });
}

let baseLayer;
function setBase(kind){
  state.base = kind;
  if(baseLayer) map.removeLayer(baseLayer);
  baseLayer = makeBase(kind).addTo(map);
  baseLayer.bringToBack();
}

/* ---------------- url hash ---------------- */

function writeHash(){
  const c = map.getCenter();
  const p = new URLSearchParams();
  p.set("z", map.getZoom());
  p.set("lat", c.lat.toFixed(5));
  p.set("lng", c.lng.toFixed(5));
  if(state.taxon){ p.set("taxon", state.taxon); if(state.tname) p.set("tname", state.tname); }
  if(state.iconic.length) p.set("iconic", state.iconic.join(","));
  if(state.unobs)   p.set("unobs", state.unobs);
  if(state.dmode !== "unobserved") p.set("dmode", state.dmode);
  if(state.ssp)     p.set("ssp", state.ssp);
  p.set("q", state.quality.join(","));
  p.set("precise", state.precise);
  p.set("d1", state.d1);
  if(state.d2)      p.set("d2", state.d2);
  if(state.style !== "accuracy") p.set("s", state.style);
  if(state.base !== "dark")  p.set("b", state.base);
  if(state.cursor !== "precise") p.set("cur", state.cursor);
  history.replaceState(null, "", "#" + p.toString());
}

function readHash(){
  const p = new URLSearchParams(location.hash.replace(/^#/, ""));
  state.taxon   = p.get("taxon") || null;
  state.tname   = p.get("tname") || "";
  state.iconic  = (p.get("iconic") || "").split(",").filter(Boolean);
  state.unobs   = p.get("unobs") || "";
  state.dmode   = p.get("dmode") || "unobserved";
  state.ssp     = ["1","only"].includes(p.get("ssp")) ? p.get("ssp") : "";
  state.quality = p.has("q") ? p.get("q").split(",").filter(Boolean) : defaultQuality();
  state.precise = p.has("precise") ? p.get("precise") : "precise";
  state.d1      = p.has("d1") ? p.get("d1") : defaultD1();
  state.d2      = p.get("d2") || "";
  state.style   = p.get("s") || "accuracy";
  state.base    = p.get("b") || "dark";
  state.cursor  = p.get("cur") || "precise";
  return {
    z:   p.has("z")   ? +p.get("z")   : 4,
    lat: p.has("lat") ? +p.get("lat") : 20,
    lng: p.has("lng") ? +p.get("lng") : 8
  };
}

/* ---------------- specimen label ---------------- */

function fmtYear(d){ return d ? d.slice(0,4) : ""; }

function renderLabel(){
  const bits = [];
  if(state.taxon){
    bits.push(`<span class="sci">${esc(state.tname || "Taxon " + state.taxon)}</span>`);
  } else if(state.iconic.length){
    bits.push(state.iconic.map(v => {
      const hit = ICONIC.find(i => i[0] === v);
      return esc(hit ? hit[1] : v);
    }).join(" + "));
  }
  // Grade and precision are only worth the width when they stray from the defaults.
  if(state.quality.length && !isDefaultQuality()){
    const names = state.quality.map(v => {
      const hit = QUALITY.find(q => q[0] === v);
      return esc(hit ? hit[1] : v);
    });
    bits.push(names.join(" + ") + " grade");
  }
  if(state.unobs){
    if(state.dmode === "unobserved") bits.push("new for @" + esc(state.unobs));
    else bits.push("@" + esc(state.unobs) + " missing Lvl " + esc(state.dmode.toUpperCase()));
    if(state.ssp === "only") bits.push("subspecies only");
    else if(state.ssp)       bits.push("incl. subspecies");
  }
  if(!state.precise) bits.push("incl. obscured");
  if(state.d1 || state.d2){
    bits.push(esc(fmtYear(state.d1) + " – " + (fmtYear(state.d2) || "now")));
  }
  document.getElementById("labelText").innerHTML =
    bits.length ? bits.join('<span class="sep">/</span>')
                : '<span class="dim">All observations</span>';
}

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

/* ---------------- Lvl tag report ---------------- */

// Every species a user has recorded, banded by the best Lvl tag it carries. iNat has no
// view for "my species by tag", so the sets are crossed here and written into a plain
// standalone page in a new tab. The report ignores the panel's mode row — it always
// reports all four tiers.

function taxonObsUrl(taxonId, user){
  return "https://www.inaturalist.org/observations?taxon_id=" + encodeURIComponent(taxonId)
       + "&user_id=" + encodeURIComponent(user) + "&verifiable=any";
}

// Everything this user has tagged at one tier, on iNat itself — the tier headings link here.
function tagObsUrl(tag, user){
  return "https://www.inaturalist.org/observations?q=" + encodeURIComponent(tag)
       + "&search_on=tags&user_id=" + encodeURIComponent(user);
}

function scopeLabel(){
  if(state.taxon) return state.tname || ("taxon " + state.taxon);
  if(state.iconic.length) return state.iconic.map(v => {
    const hit = ICONIC.find(i => i[0] === v);
    return hit ? hit[1] : v;
  }).join(" + ");
  return "all taxa";
}

// species_counts groups by leaf taxon, so an observation left at genus or family lands
// here as its own row — drop anything coarser than species so the list reads as species.
// rank_level: species and hybrid 10, subspecies 5. Absent rank_level fails open.
function isSpeciesRow(x){ return !(x.taxon.rank_level > 10); }

// The name the list sorts and labels by — common where iNat has one, binomial otherwise.
function sortName(t){ return (t.preferred_common_name || t.name || "").toLowerCase(); }

// The report's sections, weakest first. A species sits at the best tag it carries, so
// these read as where it stands rather than what it lacks.
// Third field is the tag the heading links to on iNat; "" for Untagged, which has no tag
// search to point at.
const TIERS = [
  ["Untagged", "Not one observation carries a Lvl tag.",         ""],
  ["Lvl C",    "C is the best tag on it — nothing tagged B or S.", "c"],
  ["Lvl B",    "B is the best tag on it — nothing tagged S.",      "b"],
  ["Lvl S",    "Carries an S tag, the top tier.",                  "s"]
];

// Band every species the user has recorded by its best tag. The tiers override downwards,
// S over B over C, so a species tagged both S and C counts as Lvl S and appears once.
// Nothing drops out — the four tiers together are everything recorded in scope. Takes one
// request per tag plus the user's full species list, so the report reads the same whatever
// the panel's level buttons say.
async function speciesByLvl(user){
  const have = {};
  for(const tag of LEVELS) have[tag] = await speciesIdsWithTag(user, tag);
  const all = await speciesCounts(userScope(user));
  const buckets = TIERS.map(() => []);
  for(const x of all){
    if(!isSpeciesRow(x)) continue;
    const has = tag => have[tag].has(x.taxon.id);
    buckets[has("s") ? 3 : has("b") ? 2 : has("c") ? 1 : 0].push(x);
  }
  // Heaviest-recorded first inside each tier: the species you already have the most shots
  // of are the ones most likely to hold a taggable frame. The page can flip to A–Z
  // without a refetch.
  buckets.forEach(rows => rows.sort((a,b) =>
    b.count - a.count || sortName(a.taxon).localeCompare(sortName(b.taxon))));
  return buckets;
}

function reportPage(user, sub, main, busy){
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Lvl tags &mdash; @${esc(user)}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>${REPORT_CSS}</style></head><body><div class="wrap">
<header>
  <h1><span class="lozenge"></span>Species by Lvl tag
    <button type="button" class="refresh" id="refresh"${busy ? " disabled" : ""}>${
      busy ? "Reading&hellip;" : "Refresh"}</button></h1>
  <p class="sub"><b>@${esc(user)}</b> &middot; ${esc(scopeLabel())} &middot; ${sub}</p>
  <p class="note">Every species this user has recorded, banded by the best Lvl tag it carries
     and listed weakest first. The tiers override downwards &mdash; S beats B beats C &mdash; so a
     species tagged S counts as Lvl S whatever else sits on it, and appears once. IDs left
     coarser than species are not counted. Each link opens their observations of that species,
     casual ones included.</p>
</header>
${main}
</div>
<script>
// Refetches through the opener, which owns the query code and the window handle. The
// hook is re-hung after every paint, so it survives repeated refreshes; it only goes
// missing if the map tab was closed, which the button reports rather than hiding.
(function(){
  var btn = document.getElementById("refresh");
  if(!btn) return;
  btn.addEventListener("click", function(){
    var on = document.querySelector(".sortbar button.on");
    btn.disabled = true;
    btn.innerHTML = "Reading&hellip;";
    try{
      window.__refresh(on ? on.getAttribute("data-by") : "count");
    }catch(e){
      btn.disabled = false;
      btn.textContent = "Map tab closed";
    }
  });
})();

// Re-sorts by shuffling the rendered rows, so flipping order costs no refetch and needs
// no second copy of the row markup. The one sortbar drives every tier, each sorted and
// renumbered within itself. No-op on the loading paint, which has no lists.
(function(){
  var lists = [].slice.call(document.querySelectorAll("ul"));
  if(!lists.length) return;
  var btns = [].slice.call(document.querySelectorAll(".sortbar button"));
  btns.forEach(function(b){
    b.addEventListener("click", function(){
      btns.forEach(function(x){ x.className = x === b ? "on" : ""; });
      var byCount = b.getAttribute("data-by") === "count";
      lists.forEach(function(ul){
        [].slice.call(ul.children).sort(function(p, q){
          var pn = p.getAttribute("data-name"), qn = q.getAttribute("data-name");
          if(!byCount) return pn.localeCompare(qn);
          return (+q.getAttribute("data-count")) - (+p.getAttribute("data-count")) || pn.localeCompare(qn);
        }).forEach(function(li, i){
          li.firstElementChild.textContent = i + 1;   // .num
          ul.appendChild(li);                          // moves, does not clone
        });
      });
      scrollTo(0, 0);
    });
  });
})();

// Index rail: scrolls rather than navigating, since a document.write'd popup has no real
// URL to hang a fragment on. The highlight follows whichever tier heading last passed
// under the top of the viewport.
(function(){
  var links = [].slice.call(document.querySelectorAll(".index a"));
  if(!links.length) return;
  var tiers = links.map(function(a){ return document.getElementById(a.getAttribute("href").slice(1)); });
  links.forEach(function(a, i){
    a.addEventListener("click", function(e){
      e.preventDefault();
      if(tiers[i]) tiers[i].scrollIntoView({ behavior:"smooth", block:"start" });
    });
  });
  var mark = function(){
    var at = 0;
    tiers.forEach(function(sec, i){ if(sec && sec.getBoundingClientRect().top <= 90) at = i; });
    links.forEach(function(a, i){ a.className = i === at ? "on" : ""; });
  };
  addEventListener("scroll", mark, { passive:true });
  mark();
})();
<\/script>
</body></html>`;
}

function lvlRowHtml(x, i, user){
  const t = x.taxon;
  const url = taxonObsUrl(t.id, user);
  const photo = t.default_photo && (t.default_photo.medium_url || t.default_photo.square_url);
  // Plenty of taxa have no English name; those lead with the binomial instead of
  // printing it twice, set in the same italic serif the second line would have used.
  const common = t.preferred_common_name || "";
  return `<li data-count="${x.count}" data-name="${esc(sortName(t))}">
    <span class="num">${i + 1}</span>
    <a class="shot" href="${esc(url)}" target="_blank" rel="noopener" tabindex="-1" aria-hidden="true">${
      photo ? `<img src="${esc(photo)}" alt="" loading="lazy">`
            : `<span class="nophoto">&#9673;</span>`}</a>
    <span class="body">
      <span class="common${common ? "" : " as-sci"}"><a href="${esc(url)}" target="_blank" rel="noopener">${
        esc(common || t.name || "Unnamed")}</a></span>
      ${common && t.name ? `<span class="sci">${esc(t.name)}</span>` : ""}
      <span class="meta">${x.count} observation${x.count === 1 ? "" : "s"}${
        t.rank ? " &middot; " + esc(t.rank) : ""}</span>
      <span class="url"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a></span>
    </span>
  </li>`;
}

// `sortBy` carries the reader's choice through a refresh — the buckets arrive ordered by
// count, so only "name" needs a re-sort here.
function lvlListHtml(buckets, user, sortBy){
  if(!buckets.some(rows => rows.length)){
    return `<div class="state">
      <div class="state-lede">Nothing to show.</div>
      <div class="state-hint">This user has no species recorded in this scope.</div>
    </div>`;
  }
  const byName = sortBy === "name";
  // One sortbar for the page: it re-sorts each tier in place, so the tiers hold their order.
  const sortbar = `<div class="sortbar">Sort
    <button type="button" data-by="count"${byName ? "" : ` class="on"`}>Most observed</button>
    <button type="button" data-by="name"${byName ? ` class="on"` : ""}>A&ndash;Z</button>
  </div>`;
  const index = `<nav class="index">` + TIERS.map(([title], i) =>
    `<a href="#tier-${i}">${esc(title)}<span class="n">${buckets[i].length}</span></a>`
  ).join("") + `</nav>`;
  const sections = TIERS.map(([title, blurb, tag], i) => {
    const rows = byName
      ? buckets[i].slice().sort((a, b) => sortName(a.taxon).localeCompare(sortName(b.taxon)))
      : buckets[i];
    // A tagged tier heads out to that tag search on iNat; Untagged has nothing to point at.
    const head = tag
      ? `<a href="${esc(tagObsUrl(tag, user))}" target="_blank" rel="noopener"
            title="Every ${esc(title)} observation on iNaturalist">${esc(title)}</a>`
      : esc(title);
    return `<section class="tier" id="tier-${i}">
      <h2>${head}<span class="n">${rows.length}</span></h2>
      <p class="blurb">${esc(blurb)}</p>
      ${rows.length ? "<ul>" + rows.map((x, n) => lvlRowHtml(x, n, user)).join("") + "</ul>"
                    : `<p class="clear">All clear.</p>`}
    </section>`;
  }).join("");
  return `<div class="cols">${index}<div class="tiers">${sortbar}${sections}</div></div>`;
}

// Opens the tab synchronously (a popup blocker would kill a post-fetch window.open) and
// repaints it once the difference resolves. Returns false only if the popup was blocked.
// The report's Refresh button reaches back through `win.__refresh`, so the query code
// lives here only — the scope it reads is whatever the panel holds at the time.
async function openLvlReport(user){
  const win = window.open("", "_blank");
  if(!win) return false;
  const draw = (sub, main, busy) => {
    if(win.closed) return;
    win.document.open();
    win.document.write(reportPage(user, sub, main, busy));
    win.document.close();
    win.__refresh = run;                     // the write above wiped the last one
  };
  const run = async (sortBy) => {
    draw("reading&hellip;", `<div class="state">
      <div class="state-lede">Compiling the list&hellip;</div>
      <div class="state-hint">Reading every species @${esc(user)} has recorded, then sorting them by the tags they carry.</div>
    </div>`, true);
    try{
      const buckets = await speciesByLvl(user);
      const total = buckets.reduce((n, rows) => n + rows.length, 0);
      draw(`${total} species`, lvlListHtml(buckets, user, sortBy));
    }catch(e){
      draw("failed", `<div class="state">
        <div class="state-lede">The list didn't come back.</div>
        <div class="state-hint">iNaturalist may be rate-limiting, or that username may not exist.</div>
      </div>`);
    }
  };
  await run("count");
  return true;
}

/* ---------------- accuracy pin layer ---------------- */

const accLegend = document.getElementById("accLegend");
const accStatus = document.getElementById("accStatus");
const accBar = document.getElementById("accBar");
const ACC_MIN_ZOOM = 9;

let accSeq = 0, accTimer = null;

// Tap radius sits in the legend, which is static DOM — so it is wired once here rather
// than on every sheet render. It only changes the next tap, so no refetch is needed.
const cursorRow = document.getElementById("cursorRow");
function renderCursorRow(){
  [...cursorRow.children].forEach(c => c.setAttribute("aria-pressed", c.dataset.v === state.cursor));
}
cursorRow.addEventListener("click", e => {
  const b = e.target.closest("button[data-v]");
  if(!b) return;
  state.cursor = b.dataset.v;
  renderCursorRow();
  writeHash();
});

function scheduleAccRefresh(){
  clearTimeout(accTimer);
  accTimer = setTimeout(refreshAccuracyLayer, 300);
}

async function refreshAccuracyLayer(){
  if(state.style !== "accuracy") return;
  const zoom = map.getZoom();
  if(zoom < ACC_MIN_ZOOM){
    accLayer.clearLayers();
    accStatus.textContent = `Zoom in to load pins (zoom ${zoom} of ${ACC_MIN_ZOOM}+)`;
    return;
  }
  const mine = ++accSeq;
  accStatus.textContent = "Loading…";
  const b = map.getBounds();
  const p = obsParams();
  p.set("swlat", b.getSouth().toFixed(6));
  p.set("swlng", b.getWest().toFixed(6));
  p.set("nelat", b.getNorth().toFixed(6));
  p.set("nelng", b.getEast().toFixed(6));
  p.set("per_page", "200");
  p.set("order_by", "id");
  p.set("order", "desc");

  try{
    const r = await fetch(`${API}/observations?${p.toString()}`);
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(mine !== accSeq || state.style !== "accuracy") return;

    accLayer.clearLayers();
    (d.results || []).forEach(o => {
      if(!o.location) return;
      const [lat, lng] = o.location.split(",").map(Number);
      if(!isFinite(lat) || !isFinite(lng)) return;

      const acc = o.public_positional_accuracy != null ? o.public_positional_accuracy : o.positional_accuracy;
      const known = acc != null && isFinite(acc);
      const t = o.taxon || {};

      const ring = known ? "rgba(255,255,255,.85)" : ACC_UNKNOWN_RING;
      const fill = known ? accuracyColor(acc) : ACC_UNKNOWN_FILL;
      const audio = isAudioOnly(o);

      const marker = audio
        ? L.marker([lat, lng], {
            icon: L.divIcon({
              className: "snd-pin", html: speakerSvg(fill, ring),
              iconSize: [19,19], iconAnchor: [9.5,9.5]
            })
          })
        : L.circleMarker([lat, lng], {
            radius: 6, weight: 1.5, color: ring, fillColor: fill, fillOpacity: .9
          });
      marker.bindTooltip(
        `${esc(t.preferred_common_name || t.name || "Unidentified")} — ${fmtAcc(known ? acc : null)}${audio ? " &middot; sound only" : ""}`,
        { direction: "top", offset: [0,-4], opacity: .95 }
      );
      marker.on("click", e => {
        L.DomEvent.stopPropagation(e);
        window.open("https://www.inaturalist.org/observations/" + o.id, "_blank", "noopener");
      });
      marker.addTo(accLayer);
    });

    const shown = d.results ? d.results.length : 0;
    const total = d.total_results || 0;
    accStatus.textContent = total > shown
      ? `${shown} of ${total.toLocaleString()} in view — zoom in for more`
      : `${shown} in view`;
  }catch(err){
    if(mine !== accSeq) return;
    accStatus.textContent = "Couldn't load pins — pan or zoom to retry.";
  }
}

function applyStyle(){
  if(state.style === "accuracy"){
    if(map.hasLayer(overlay)) map.removeLayer(overlay);
    accLegend.hidden = false;
    refreshAccuracyLayer();
  }else{
    accLegend.hidden = true;
    accLayer.clearLayers();
    if(!map.hasLayer(overlay)) overlay.addTo(map);
    refreshOverlay();
  }
}

function commit(){ applyStyle(); renderLabel(); writeHash(); }

function wireFilters(){
  const $ = id => document.getElementById(id);

  $("doneBtn").addEventListener("click", closeSheet);

  $("reset").addEventListener("click", () => {
    Object.assign(state, { taxon:null, tname:"", iconic:[], quality:defaultQuality(), d1:defaultD1(), d2:"", unobs:"", precise:"precise", dmode:"unobserved", lvlExclude:null, ssp:"" });
    commit();
    openFilters();
  });

  // taxon autocomplete
  const input = $("taxonInput"), ac = $("ac");
  let timer = null, seq = 0;

  input.addEventListener("input", () => {
    const q = input.value.trim();
    clearTimeout(timer);
    if(q.length < 2){ ac.hidden = true; ac.innerHTML = ""; return; }
    timer = setTimeout(async () => {
      const mine = ++seq;
      try{
        const r = await fetch(`${API}/taxa/autocomplete?per_page=8&q=${encodeURIComponent(q)}`);
        const d = await r.json();
        if(mine !== seq) return;
        if(!d.results || !d.results.length){ ac.hidden = true; return; }
        ac.innerHTML = d.results.map(t => {
          const thumb = t.default_photo && t.default_photo.square_url;
          return `<button type="button" data-id="${t.id}" data-name="${esc(t.name)}">
            ${thumb ? `<img src="${esc(thumb)}" alt="" loading="lazy">` : `<span class="ac-nophoto"></span>`}
            <span class="ac-name">
              <span class="ac-common">${esc(t.preferred_common_name || t.name)}</span>
              <span class="ac-sci">${esc(t.name)}</span>
            </span>
            <span class="ac-rank">${esc(t.rank || "")}</span>
          </button>`;
        }).join("");
        ac.hidden = false;
      }catch(e){ ac.hidden = true; }
    }, 280);
  });

  ac.addEventListener("click", e => {
    const b = e.target.closest("button[data-id]");
    if(!b) return;
    state.taxon  = b.dataset.id;
    state.tname  = b.dataset.name;
    state.iconic = [];
    ac.hidden = true; input.value = "";
    commit();
    if(state.dmode !== "unobserved") syncLvlExclude().then(commit);
    openFilters();
  });

  $("taxonClear").addEventListener("click", () => {
    state.taxon = null; state.tname = "";
    commit();
    if(state.dmode !== "unobserved") syncLvlExclude().then(commit);
    openFilters();
  });

  $("iconicRow").addEventListener("click", e => {
    const b = e.target.closest("button[data-v]");
    if(!b) return;
    const v = b.dataset.v;
    state.iconic = state.iconic.includes(v)
      ? state.iconic.filter(x => x !== v)
      : [...state.iconic, v];
    if(state.iconic.length){ state.taxon = null; state.tname = ""; }
    commit();
    if(state.dmode !== "unobserved") syncLvlExclude().then(commit);
    openFilters();
  });

  // A mouse wheel only emits deltaY, which this single row would otherwise ignore —
  // translate it to horizontal movement. Trackpads sending deltaX are left alone, and
  // the event stays unclaimed at either end so the sheet can still scroll past it.
  $("iconicRow").addEventListener("wheel", e => {
    const row = e.currentTarget;
    if(Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    const max = row.scrollWidth - row.clientWidth;
    if(max <= 0) return;
    const next = Math.max(0, Math.min(max, row.scrollLeft + e.deltaY));
    if(next === row.scrollLeft) return;
    e.preventDefault();
    row.scrollLeft = next;
  }, { passive:false });

  $("qualityRow").addEventListener("click", e => {
    const b = e.target.closest("button[data-v]");
    if(!b) return;
    const v = b.dataset.v;
    state.quality = state.quality.includes(v)
      ? state.quality.filter(x => x !== v)
      : [...state.quality, v];
    commit();
    openFilters();
  });

  const seg = (id, key) => $(id).addEventListener("click", e => {
    const b = e.target.closest("button[data-v]");
    if(!b) return;
    state[key] = b.dataset.v;
    [...$(id).children].forEach(c => c.setAttribute("aria-pressed", c === b));
    if(key === "base"){ setBase(b.dataset.v); writeHash(); }
    else commit();
  });
  seg("preciseRow","precise");
  seg("styleRow","style");
  seg("baseRow","base");

  // Rank window for the desired-species query. The two boxes are one setting wearing two
  // ticks, so each clears the other; both off is the floored-at-species default. Only the
  // map layer reads it, so no refetch of the level exclusions is needed — commit() repaints.
  {
    const incl = $("sspBox"), only = $("sspOnlyBox");
    const setSsp = v => {
      state.ssp = v;
      incl.checked = v === "1";
      only.checked = v === "only";
      commit();
    };
    incl.addEventListener("change", e => setSsp(e.target.checked ? "1" : ""));
    only.addEventListener("change", e => setSsp(e.target.checked ? "only" : ""));
  }

  // Desired-species mode (Unobserved vs a level). Selecting a level re-derives its exclude set.
  $("unobsModeRow").addEventListener("click", e => {
    const b = e.target.closest("button[data-mode]");
    if(!b) return;
    state.dmode = b.dataset.mode;
    [...$("unobsModeRow").children].forEach(c => c.setAttribute("aria-pressed", c === b));
    syncLvlExclude().then(commit);
  });

  // Reads the username straight off the field rather than state.unobs, which the 420ms
  // debounce below may not have committed yet. The report covers every tier regardless of
  // the mode row, so the username is all it needs.
  $("lvlListBtn").addEventListener("click", async function(){
    const hint = $("lvlListHint"), user = $("unobsInput").value.trim();
    const say = msg => { hint.textContent = msg; hint.hidden = false; };
    if(!user){ say("Enter an iNaturalist username above first."); $("unobsInput").focus(); return; }
    hint.hidden = true;
    this.dataset.busy = "1";
    const opened = await openLvlReport(user);
    this.dataset.busy = "0";
    if(!opened) say("Allow pop-ups for this page to open the list.");
  });

  const debounced = (el, key) => {
    let t = null;
    el.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => { state[key] = el.value.trim(); commit(); }, 420);
    });
  };
  debounced($("d1Input"), "d1");
  debounced($("d2Input"), "d2");

  // Desired-species username: also re-derive level exclusions when it changes.
  { let t = null;
    $("unobsInput").addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => { state.unobs = $("unobsInput").value.trim(); syncLvlExclude().then(commit); }, 420);
    });
  }
}

document.getElementById("labelBar").addEventListener("click", () => {
  if(sheetView === "filters") closeSheet(); else openFilters();
});

/* ---------------- probe: what's at this point ---------------- */

// Tap radius, in km. "precise" keeps a fixed 28px reach; "large" scales with the
// viewport so the circle spans ~80% of its shorter edge (0.4 = 80% diameter), which
// keeps the whole ring on screen at any zoom.
function probeRadiusKm(lat, zoom){
  const mPerPx = 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, zoom);
  const big = state.cursor === "large";
  const size = map.getSize();
  const px  = big ? Math.min(size.x, size.y) * 0.4 : 28;
  const cap = big ? 5000 : 60;
  return Math.min(cap, Math.max(0.05, mPerPx * px / 1000));
}

const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
function fmtDate(iso){
  if(!iso) return "No date";
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return `${+m[3]} ${MONTHS[+m[2]-1]} ${m[1]}`;
}

function speciesUrl(latlng, km){
  const p = obsParams();
  p.set("lat", latlng.lat.toFixed(6));
  p.set("lng", latlng.lng.toFixed(6));
  p.set("radius", km.toFixed(3));
  p.set("view", "species");
  return "https://www.inaturalist.org/observations?" + p.toString();
}

function resultsHtml(list, km, latlng){
  if(!list.length){
    return `<div class="eyebrow"><span>Nothing here</span></div>
      <div class="state">
        <div class="state-lede">No observations within ${km.toFixed(1)} km.</div>
        <div class="state-hint">Zoom out and tap again, or loosen the filters.</div>
      </div>`;
  }
  const rows = list.map(o => {
    const t = o.taxon || {};
    const photo = o.photos && o.photos[0] && o.photos[0].url ? o.photos[0].url.replace("square","small") : null;
    const acc = o.public_positional_accuracy != null ? o.public_positional_accuracy : o.positional_accuracy;
    const accKnown = acc != null && isFinite(acc);
    const accDot = accKnown
      ? `<span class="acc-dot" style="background:${accuracyColor(acc)}"></span>`
      : `<span class="acc-dot acc-dot-unknown"></span>`;
    const meta = [];
    meta.push(fmtDate(o.observed_on));
    meta.push(`${accDot}${esc(fmtAcc(accKnown ? acc : null))}`);
    if(o.user && o.user.login) meta.push("@" + esc(o.user.login));
    let badges = "";
    if(o.quality_grade === "research") badges += `<span class="badge badge-rg">Research</span>`;
    if(o.obscured) badges += `<span class="badge badge-ob">Obscured</span>`;
    return `<button class="result" data-id="${o.id}">
      ${photo ? `<img class="result-photo" src="${esc(photo)}" alt="" loading="lazy">`
              : isAudioOnly(o)
                ? `<span class="result-nophoto result-audio" title="Sound only">${speakerSvg("currentColor","currentColor")}</span>`
                : `<span class="result-nophoto">&#9673;</span>`}
      <span class="result-main">
        <span class="result-common">${esc(t.preferred_common_name || t.name || "Unidentified")}</span>
        ${t.name ? `<span class="result-sci">${esc(t.name)}</span>` : ""}
        <span class="result-meta">${meta.join(" &middot; ")}${badges}</span>
      </span>
    </button>`;
  }).join("");
  return `<div class="eyebrow"><span>${list.length} nearby &middot; ${km.toFixed(1)} km</span>
    <span class="eyebrow-actions">
      <button class="linkish" id="toSpecies" data-url="${esc(speciesUrl(latlng, km))}">Show as species</button>
      <button class="linkish" id="toFilters">Filters</button>
    </span></div>${rows}`;
}

function drawAccuracyCircles(list){
  probeAccLayer.clearLayers();
  if(!list.length || list.length > 3) return;
  list.forEach(o => {
    if(!o.location) return;
    const [lat, lng] = o.location.split(",").map(Number);
    if(!isFinite(lat) || !isFinite(lng)) return;
    const acc = o.public_positional_accuracy != null ? o.public_positional_accuracy : o.positional_accuracy;
    if(acc == null || !isFinite(acc) || acc <= 0) return;
    const col = accuracyColor(acc);
    L.circle([lat, lng], {
      radius: acc, color: col, weight: 1.5, opacity: .85,
      fillColor: col, fillOpacity: .12, interactive: false
    }).addTo(probeAccLayer);
  });
}

async function probe(latlng){
  const km = probeRadiusKm(latlng.lat, map.getZoom());

  if(probeMark) map.removeLayer(probeMark);
  if(probeRing) map.removeLayer(probeRing);
  probeAccLayer.clearLayers();
  probeRing = L.circle(latlng, {
    radius: km * 1000, color: MARK, weight: 1, opacity: .7,
    fillColor: MARK, fillOpacity: .07, interactive: false
  }).addTo(map);
  probeMark = L.circleMarker(latlng, {
    radius: 4, color: MARK, weight: 2, fillColor: MARK, fillOpacity: 1, interactive: false
  }).addTo(map);

  openSheet("results", `<div class="eyebrow"><span>Reading&hellip;</span></div>
    <div class="state"><div class="state-hint">Fetching observations.</div></div>`);

  const p = obsParams();
  p.set("lat", latlng.lat.toFixed(6));
  p.set("lng", latlng.lng.toFixed(6));
  p.set("radius", km.toFixed(3));
  p.set("per_page", "20");
  p.set("order_by", "observed_on");
  p.set("order", "desc");

  try{
    const r = await fetch(`${API}/observations?${p.toString()}`);
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    if(sheetView !== "results") return;
    openSheet("results", resultsHtml(d.results || [], km, latlng));
    wireResults();
    drawAccuracyCircles(d.results || []);
  }catch(err){
    openSheet("results", `<div class="eyebrow"><span>Not loaded</span></div>
      <div class="state">
        <div class="state-lede">The request didn't come back.</div>
        <div class="state-hint">Check the connection and tap the map again.</div>
      </div>`);
  }
}

function wireResults(){
  const toF = document.getElementById("toFilters");
  if(toF) toF.addEventListener("click", openFilters);
  const toS = document.getElementById("toSpecies");
  if(toS) toS.addEventListener("click", () => {
    window.open(toS.dataset.url, "_blank", "noopener");
  });
  sheetBody.querySelectorAll(".result").forEach(b => {
    b.addEventListener("click", () => {
      window.open("https://www.inaturalist.org/observations/" + b.dataset.id, "_blank", "noopener");
    });
  });
}

/* ---------------- locate ---------------- */

document.getElementById("locate").addEventListener("click", function(){
  if(!navigator.geolocation) return;
  this.dataset.busy = "1";
  navigator.geolocation.getCurrentPosition(pos => {
    this.dataset.busy = "0";
    const ll = [pos.coords.latitude, pos.coords.longitude];
    if(meRing) map.removeLayer(meRing);
    meRing = L.circleMarker(ll, {
      radius: 6, color: "#6FD3A8", weight: 3, fillColor: "#2D9CFF", fillOpacity: 1
    }).addTo(map);
    map.setView(ll, Math.max(map.getZoom(), 14));
  }, () => {
    this.dataset.busy = "0";
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
});

/* ---------------- boot ---------------- */

(function init(){
  const v = readHash();

  map = L.map("map", {
    center: [v.lat, v.lng],
    zoom: v.z,
    zoomControl: false,
    worldCopyJump: true,
    tap: false
  });

  setBase(state.base);

  overlay = L.tileLayer(tileUrl(), {
    maxZoom: 19,
    opacity: 0.85,
    crossOrigin: true
  });
  accLayer = L.layerGroup().addTo(map);
  probeAccLayer = L.layerGroup().addTo(map);
  accBar.style.background = legendGradientCss();
  renderCursorRow();
  applyStyle();

  map.on("zoomend", () => { if(state.style === "auto") refreshOverlay(); });
  map.on("moveend", () => {
    writeHash();
    if(state.style === "accuracy") scheduleAccRefresh();
  });
  map.on("click", e => probe(e.latlng));

  renderLabel();
  writeHash();

  // If a shared link lands in a level mode, resolve its exclude set then refresh.
  if(state.dmode !== "unobserved" && state.unobs) syncLvlExclude().then(commit);
})();
</script>
